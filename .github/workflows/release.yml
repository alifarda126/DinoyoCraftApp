name: Release DinoyoCraft APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          chmod +x android/gradlew
          flutter pub get

      - name: Build Release APKs (Universal & ARM64)
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=https://api.dinoyocraft.my.id
          cp build/app/outputs/flutter-apk/app-release.apk "DinoyoCraft-${GITHUB_REF_NAME:-v1.0.0}.apk"
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://api.dinoyocraft.my.id
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "DinoyoCraft-${GITHUB_REF_NAME:-v1.0.0}-arm64-v8a.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinoyoCraft-APK
          path: DinoyoCraft-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "DinoyoCraft Mobile ${{ github.ref_name }}"
          body: |
            ## DinoyoCraft Android Release (${{ github.ref_name }})
            - Terhubung langsung ke server produksi `https://api.dinoyocraft.my.id`
            - Realtime chat & notifikasi (Pusher + Firebase Cloud Messaging)
            - Login Email, OTP 2FA, & Google Sign-In siap pakai

            ### Pilih File APK
            - **`DinoyoCraft-${{ github.ref_name }}-arm64-v8a.apk`** *(Direkomendasikan — ukuran ringan ~28 MB untuk hampir semua HP Android modern)*
            - **`DinoyoCraft-${{ github.ref_name }}.apk`** *(Universal — mendukung seluruh arsitektur ARM64, ARMv7, dan emulator x86_64)*
          files: |
            DinoyoCraft-${{ github.ref_name }}-arm64-v8a.apk
            DinoyoCraft-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
