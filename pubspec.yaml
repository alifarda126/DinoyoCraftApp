name: dinoyocraftmobile
description: "DinoyoCraft — marketplace keramik lokal Kampung Keramik Dinoyo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  photo_manager: ^3.12.0
  path_provider: ^2.1.6
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/stickers/

flutter_launcher_icons:
  # iOS - pakai image dengan background putih sudah di-embed
  ios: true
  image_path: "assets/images/logo_icon_zoomed.png"
  remove_alpha_ios: true
  # Android - adaptive icon: background putih, foreground logo transparan
  # Android launcher otomatis memotong menjadi bulat/circle
  android: "launcher_icon"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo_adaptive_fg.png"
