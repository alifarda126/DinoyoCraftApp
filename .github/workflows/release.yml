name: Release DinoyoCraft APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://api.dinoyocraft.my.id
          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "DinoyoCraft-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "DinoyoCraft-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "DinoyoCraft-${TAG}-x86_64.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinoyoCraft-APK
          path: DinoyoCraft-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "DinoyoCraft Mobile ${{ github.ref_name }}"
          body: |
            ## DinoyoCraft Android Release (${{ github.ref_name }})
            - Terhubung langsung ke server produksi `https://api.dinoyocraft.my.id`
            - Realtime chat & notifikasi (Pusher + Firebase Cloud Messaging)
            - Login Email, OTP 2FA, & Google Sign-In siap pakai

            ### Pilih File APK
            - **`DinoyoCraft-${{ github.ref_name }}-arm64-v8a.apk`** *(Direkomendasikan — untuk hampir semua HP Android modern 64-bit)*
            - **`DinoyoCraft-${{ github.ref_name }}-armeabi-v7a.apk`** *(Untuk HP Android 32-bit lama)*
            - **`DinoyoCraft-${{ github.ref_name }}-x86_64.apk`** *(Untuk Emulator Android di PC/Laptop)*
          files: |
            DinoyoCraft-${{ github.ref_name }}-arm64-v8a.apk
            DinoyoCraft-${{ github.ref_name }}-armeabi-v7a.apk
            DinoyoCraft-${{ github.ref_name }}-x86_64.apk
          draft: false
          prerelease: false
